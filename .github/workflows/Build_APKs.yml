name: 📦 Extract Product Apps Pro

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'HyperOS ROM 下载链接 (卡刷包 .zip)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Environment
        run: |
          echo "=== 1. 初始化环境 ==="
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -yqq aria2 p7zip-full zip
          chmod -R +x tools/

      - name: Download ROM with Aria2
        run: |
          echo "📥 下载 ROM 中..."
          aria2c -x16 -s16 -j$(nproc) -U "Mozilla/5.0" -d . "${{ github.event.inputs.rom_url }}" -o rom.zip

      - name: Extract Payload and Partitions
        run: |
          echo "📦 提取 Payload..."
          7z e rom.zip payload.bin > /dev/null
          rm rom.zip
          
          echo "🛠️ 提取 Product 和 mi_ext 镜像..."
          mkdir -p extracted_images
          ./tools/payload_extract -s -o extracted_images -i payload.bin -X product,mi_ext -T0
          rm payload.bin

      - name: Extract EROFS Images
        run: |
          echo "📂 解包 EROFS 镜像..."
          mkdir -p product_files mi_ext_files
          
          # 解包镜像
          cd product_files && sudo ../tools/extract.erofs -i ../extracted_images/product.img -x -s && cd ..
          cd mi_ext_files && sudo ../tools/extract.erofs -i ../extracted_images/mi_ext.img -x -s && cd ..
          
          sudo rm -rf extracted_images

      - name: Read Properties from mi_ext
        id: props
        run: |
          echo "🔍 正在读取 build.prop 信息..."
          # 搜索 build.prop 文件位置
          PROP_PATH=$(sudo find mi_ext_files -name "build.prop" | head -n 1)
          
          if [ -f "$PROP_PATH" ]; then
            echo "找到配置文件: $PROP_PATH"
            # 按照要求的顺序提取并赋值给新变量
            DEVICE_DEV=$(sudo grep "ro.product.mod_device=" $PROP_PATH | cut -d'=' -f2)
            SOTA_VER=$(sudo grep "ro.mi.xms.version.incremental=" $PROP_PATH | cut -d'=' -f2)
            OS_VER=$(sudo grep "ro.mi.os.version.incremental=" $PROP_PATH | cut -d'=' -f2)
            
            # 写入 GitHub Output 供后续步骤使用
            echo "device_dev=${DEVICE_DEV}" >> $GITHUB_OUTPUT
            echo "sota_ver=${SOTA_VER}" >> $GITHUB_OUTPUT
            echo "os_ver=${OS_VER}" >> $GITHUB_OUTPUT
            
            echo "✅ 提取成功: Device=$DEVICE_DEV, SOTA=$SOTA_VER, OS=$OS_VER"
          else
            echo "⚠️ 未找到 build.prop，将使用默认值"
            echo "device_dev=Unknown_Device" >> $GITHUB_OUTPUT
            echo "sota_ver=Unknown" >> $GITHUB_OUTPUT
            echo "os_ver=Unknown_OS" >> $GITHUB_OUTPUT
          fi

      - name: Collect Target Folders and Fast Compress
        run: |
          echo "🔍 寻找并整理目标文件夹..."
          mkdir -p target_apps
          
          # 遍历 product 解压目录，寻找目标文件夹并复制
          for base_dir in "product_files" "product_files/product"; do
            for target_dir in "app" "data-app" "priv-app"; do
              if [ -d "$base_dir/$target_dir" ]; then
                echo "发现并准备复制: $base_dir/$target_dir"
                sudo cp -r "$base_dir/$target_dir" target_apps/
              fi
            done
          done
          
          echo "⚡ 正在执行多线程快速压缩 (7z -mx1)..."
          # 必须更改所有者，否则压缩工具可能无法读取 sudo 复制的文件
          sudo chown -R $USER:$USER target_apps/
          cd target_apps
          
          # 使用 7z 创建标准 ZIP 格式，-mx=1 (极速), -mmt=on (多线程)
          if [ -d "app" ]; then 7z a -tzip -mx=1 -mmt=on ../Product_app.zip app/; fi
          if [ -d "priv-app" ]; then 7z a -tzip -mx=1 -mmt=on ../Product_priv-app.zip priv-app/; fi
          if [ -d "data-app" ]; then 7z a -tzip -mx=1 -mmt=on ../Product_data-app.zip data-app/; fi
          
          cd ..
          
          echo "📏 检测文件体积，处理大于 2.0GB 的文件..."
          # GitHub 绝对限制是 2147483648 字节。我们设定安全阈值为 2048000000 字节 (约 1.95 GB)
          MAX_SIZE=2048000000
          
          for zipfile in Product_*.zip; do
            if [ -f "$zipfile" ]; then
              FILE_SIZE=$(stat -c%s "$zipfile")
              if [ $FILE_SIZE -gt $MAX_SIZE ]; then
                echo "⚠️ $zipfile 体积 ($FILE_SIZE bytes) 逼近 2.0GB，正在瞬间切块分卷..."
                # 使用 split 命令进行二进制切分，-b 2000M 设定单块大小，-d 采用纯数字后缀 (00, 01...)
                split -b 2000M -d "$zipfile" "${zipfile}"
                
                # 删除原版超大 zip 文件，防止触发 GitHub 上传报错
                rm "$zipfile"
                echo "✅ $zipfile 纯净分卷完成。"
              fi
            fi
          done
          
          echo "✅ 最终待上传文件列表："
          ls -lh Product_*

      - name: Generate Release Tag
        id: tag
        run: echo "release_tag=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.props.outputs.os_ver }}-${{ steps.tag.outputs.release_tag }}
          name: "📦 Product 提取 - ${{ steps.props.outputs.os_ver }}"
          body: |
            ## 📱 系统版本信息
            - **机型代号**: `${{ steps.props.outputs.device_dev }}`
            - **SOTA版本**: `${{ steps.props.outputs.sota_ver }}`
            - **系统版本**: `${{ steps.props.outputs.os_ver }}`
            
            ---
            ## 📂 文件说明
            **源 ROM**: ${{ github.event.inputs.rom_url }}
            
            为绕过 GitHub 2GB 上传限制，已拆分打包：
            - `Product_app.zip`
            - `Product_priv-app.zip`
            - `Product_data-app.zip`
            
            🚨 **重要提醒 - 关于分卷合并解压**: 
            如果某个原包达到 2GB 阈值，系统已自动切分为二进制分卷（例如 `xxx.zip00`, `xxx.zip01` 等）。
            
            **如何合并并解压**：
            1. 下载同一应用所有的 `.zip0*` 文件放入同一个文件夹。
            2. **Windows**: 在该文件夹空白处右键打开终端（或按 `Win+R` 输 `cmd` 进目录），执行：`copy /B Product_app.zip00 + Product_app.zip01 Product_app.zip`，然后正常解压新生成的 `Product_app.zip`。
            3. **Linux/Mac**: 在终端执行 `cat Product_app.zip0* > Product_app.zip` 即可。
            *(部分新版 7-Zip 也支持直接右键 .zip00 解压)*
            
            ⚡ *此包使用多线程及纯二进制分割技术生成。*
          files: |
            Product_*.zip
            Product_*.zip0*
          draft: false
          prerelease: false
